<!DOCTYPE HTML>
<html lang="zh">
<head>
    <meta charset="utf-8">
    <meta name="renderer" content="webkit|ie-comp|ie-stand">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta name="viewport"
          content="width=device-width,initial-scale=1,minimum-scale=1.0,maximum-scale=1.0,user-scalable=no"/>
    <link rel="Bookmark" href="favicon.ico">
    <link rel="Shortcut Icon" href="favicon.ico"/>
    <link rel="stylesheet" type="text/css" href="static/h-ui/css/H-ui.min.css"/>
    <link rel="stylesheet" type="text/css" href="static/h-ui.admin.pro/css/h-ui.admin.pro.css"/>
    <link rel="stylesheet" type="text/css" href="lib/Hui-iconfont/1.0.9/iconfont.css"/>
    <link rel="stylesheet" type="text/css" href="static/h-ui.admin.pro/skin/default/skin.css" id="skin"/>
    <link rel="stylesheet" type="text/css" href="static/business/css/style.css"/>
    <title>文件管理</title>
</head>

<body>
<aside class="Hui-admin-aside-wrapper">
    <div class="Hui-admin-logo-wrapper">
        <a class="logo navbar-logo" href="index.html">
            <i class="va-m iconpic global-logo"></i>
            <span class="va-m">GUI For USL</span>
        </a>
    </div>
    <div class="Hui-admin-menu-dropdown bk_2">
        <ul class="Hui-menu"></ul>
    </div>
</aside>
<div class="Hui-admin-aside-mask"></div>
<div class="Hui-admin-dislpayArrow">
    <a href="javascript:void(0);" onClick="displaynavbar(this)">
        <i class="Hui-iconfont Hui-iconfont-left">&#xe6d4;</i>
    </a>
</div>

<section class="Hui-admin-article-wrapper">
    <header class="Hui-navbar">
        <div class="navbar">
            <div class="container-fluid clearfix">
                <nav id="Hui-topNav" class="nav navbar-nav">
                    <ul class="clearfix">
                        <li><a href="member-list.html">脚本管理</a></li>
                        <li><a href="system-data.html">函数管理</a></li>
                        <li><a href="log.html">日志管理</a></li>
                    </ul>
                </nav>
            </div>
        </div>
    </header>

    <div class="Hui-admin-article">
        <article class="Hui-admin-content clearfix">
            <div class="panel">
                <div class="panel-body">
                    <div class="row clearfix">
                        <div class="col-xs-12 col-sm-6 col-md-4">
                            <div class="row clearfix mb-10">
                                <span class="col-xs-4 form-item-label">文件名称：</span>
                                <span class="col-xs-8 form-item-control">
                                    <label for="search-input-name"></label>
                                    <input type="text" name="searchInput" id="search-input-name" class="input-text"/>
									</span>
                            </div>
                        </div>
                        <div class="col-xs-12 col-sm-6 col-md-4">
                            <div class="row clearfix mb-10">
                                <span class="col-xs-4 form-item-label">文件类型：</span>
                                <span class="col-xs-8 form-item-control">
                                    <label for="search-input-suffix"></label>
                                    <input type="text" name="searchInput" id="search-input-suffix" class="input-text"/>
									</span>
                            </div>
                        </div>
                        <div class="col-xs-12 col-sm-6 col-md-4">
                            <div class="row clearfix">
									<span class="col-xs-4 form-item-control">
										<button name="" id="search-submit" class="btn btn-success radius"
                                                onclick="selectData()"><i
                                                class="Hui-iconfont">&#xe665;</i>筛选</button>
									</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="panel mt-20">
                <div class="panel-body">
                    <div class="clearfix">
							<span class="f-l">
								<button class="btn btn-primary radius"
                                        onclick="reload()" title="扫描文件"><i class="Hui-iconfont">&#xe604;</i>扫描文件</button>
                                <button class="btn btn-success radius"
                                        onclick="reload()" title="同步向量"><i class="Hui-iconfont">&#xe603;</i>同步向量</button>
                                 <button class="btn btn-danger radius"
                                         onclick="clearIndex()" title="清除缓存"><i class="Hui-iconfont">&#xe6e2;</i>清除缓存</button>
							</span>
                    </div>
                    <div class="mt-20 clearfix">
                        <table id="data-table-list"
                               class="table table-border table-bordered table-bg table-hover table-sort">
                            <thead>
                            <tr class="text-c">
                                <th>文件名称</th>
                                <th style="width: 8%">文件大小</th>
                                <th style="width: 6%">文件类型</th>
                                <th style="width: 12%">修改时间</th>
                                <th style="width: 28%">文件路径</th>
                                <th style="width: 20%">所在目录</th>
                                <th style="width: 6%">同步状态</th>
                            </tr>
                            </thead>
                            <tbody id="file-body"></tbody>
                        </table>
                    </div>
                    <div id="laypage" class="text-c"></div>
                </div>
            </div>
        </article>

        <footer class="footer Hui-admin-footer">
            <p>
                <br>Copyright &copy;2023 USL<br>
            </p>
        </footer>
    </div>
</section>

<script type="text/javascript" src="lib/jquery/1.9.1/jquery.min.js"></script>
<script type="text/javascript" src="lib/layer/3.1.1/layer.js"></script>
<script type="text/javascript" src="static/h-ui/js/H-ui.js"></script>
<script type="text/javascript" src="static/h-ui.admin.pro/js/h-ui.admin.pro.js"></script>
<script type="text/javascript" src="static/business/js/main.js"></script>
<script type="text/javascript" src="static/business/js/file.js"></script>
</body>
</html>
